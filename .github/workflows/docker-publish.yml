name: Build and publish container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

# Runs on the owner's self-hosted runner (the sodatracker-runner StatefulSet in
# gitops-deployments, which runs its own Docker daemon). Keep this repo private
# while it uses it.
#
# One job, one build:
#   1. Work out the version cocogitto will release (bump --dry-run).
#   2. Build and push the arm64 image once, stamped with that version. The
#      Dockerfile runs go vet and go test, so a failing test fails the build.
#   3. On main, do the real bump: CHANGELOG.md commit, vX.Y.Z tag, GitHub release.
#   4. Point latest (and vX.Y.Z) at the image built in step 2, without rebuilding.
# Pushes made with GITHUB_TOKEN don't start workflows, so the bump commit and
# tag don't re-trigger this one.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Installs cog and checks commits since the last tag follow Conventional
      # Commits. Advisory: a bad message shouldn't block a deploy.
      - uses: cocogitto/cocogitto-action@390bda87a19bf627e03ad075c67a11e9ddbb7547 # v4
        continue-on-error: true
        with:
          check-latest-tag-only: true

      - id: version
        run: |
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && next=$(set -o pipefail; cog bump --auto --dry-run 2>/dev/null | tail -n 1) && [[ "$next" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            version="v${next#v}"
            release=true
          else
            # No feat/fix since the last tag: vX.Y.Z-N-gSHA.
            version=$(git describe --tags --always)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version: $version (release: $release)"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,format=long

      # arm64 only: the Pi is the one place this image runs. Locally,
      # `make run` or `docker compose up --build` build for the host.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: release
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name cog-bot
          git config user.email cog-bot@users.noreply.github.com
          cog bump --auto
          tag=$(git describe --tags --exact-match HEAD)
          if [[ "$tag" != "$VERSION" ]]; then
            echo "::error::cog bumped to $tag but the image was built as $VERSION"
            exit 1
          fi
          git push origin HEAD:main
          git push origin "$tag"
          cog changelog --at "$tag" -t full_hash > RELEASE_NOTES.md

      - if: steps.release.outcome == 'success'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md

      # Re-tag the image built above; no second build.
      - name: Tag image
        env:
          SOURCE: ${{ env.IMAGE }}:sha-${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tags=()
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then tags+=(-t "$IMAGE:latest"); fi
          if [[ "$GITHUB_REF" == refs/tags/v* || "${{ steps.version.outputs.release }}" == true ]]; then
            tags+=(-t "$IMAGE:$VERSION")
          fi
          if (( ${#tags[@]} )); then
            docker buildx imagetools create "${tags[@]}" "$SOURCE"
          fi
