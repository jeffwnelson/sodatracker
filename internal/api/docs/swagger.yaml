      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_jeffwnelson_sodatracker_internal_domain.Machine'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: List all machines
      tags:
      - Machines
    post:
      consumes:
      - application/json
      description: Creates or updates a soda machine (upsert by ID)
      parameters:
      - description: Machine to create
        in: body
        name: machine
        required: true
        schema:
          $ref: '#/definitions/github_com_jeffwnelson_sodatracker_internal_domain.Machine'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_jeffwnelson_sodatracker_internal_domain.Machine'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: Create a machine
      tags:
      - Machines
  /machines/{id}:
    delete:
      description: Deletes a machine and all associated data (slots, dispenses, restocks,
        alerts)
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.DeleteResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: Delete a machine
      tags:
      - Machines
  /machines/{id}/alert-events:
    get:
      description: Returns alert events for a machine with optional active-only filter
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Only return active (uncleared) alerts
        in: query
        name: active
        type: boolean
      - description: Max results (default 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_jeffwnelson_sodatracker_internal_domain.AlertEvent'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: List fired alert events
      tags:
      - Alerts
  /machines/{id}/alerts:
    get:
      description: Returns all alert configurations for a machine
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_jeffwnelson_sodatracker_internal_domain.AlertConfig'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: List alert configs
      tags:
      - Alerts
    post:
      consumes:
      - application/json
      description: Creates an alert threshold config for a machine. SlotPosition 0
        = machine-wide default. LowThreshold -1 = use slot's own threshold.
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Alert configuration
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/github_com_jeffwnelson_sodatracker_internal_domain.AlertConfig'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_jeffwnelson_sodatracker_internal_domain.AlertConfig'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - ApiKeyAuth: []
